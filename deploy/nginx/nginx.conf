        # Документация
        location /docs {
            alias /usr/local/var/www/documentation/;
            autoindex on;

            location ~ \.md$ {
                default_type text/html;
                try_files $uri.html $uri =404;
            }

            location ~* ^/(static|legacy|docs|managment|reserved)/.*\.(svg|jpg|jpeg|png|gif|ico|css|js)$ {
                root /usr/local/var/www;
                try_files $uri $uri/ =404;
                expires 30d;
                add_header Cache-Control "public";

                location ~ \.svg$ {
                    add_header Content-Type "image/svg+xml";
                    add_header Access-Control-Allow-Origin "*";
                }
            }


            location ~ \.html$ {
                try_files $uri $uri/ =404;
                default_type text/html;
            }
        }

        # Статика
        location ~* \.(svg|jpg|jpeg|png|gif|ico|css|js)$ {
            root /usr/local/var/www/static;
            try_files $uri $uri/ =404;
            expires 30d;
            add_header Cache-Control "public";

            location ~ \.svg$ {
                add_header Content-Type "image/svg+xml";
                add_header Access-Control-Allow-Origin "*";
            }
        }

        # Главная страница
        location / {
            alias /usr/local/var/www/static/;
            try_files $uri $uri/ /index.html;
        }

        # Резервный путь
        location /reserved/ {
            alias /usr/local/var/www/static/;
            try_files $uri $uri/ /index.html;
        }

        # Статус сервера
        location /status {
            stub_status on;
        }

        # Управляющая панель
        location /managment {
            alias /usr/local/var/www/management/;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # Обработка ошибок
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/local/var/www/static;
        }
    }

    server {
        listen 80;
        server_name pgadmin.localhost;

        # Просто проксируем всё на pgAdmin
        location / {
            proxy_pass http://127.0.0.1:5050;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Accept-Encoding "";

            # Отключаем кэширование, если нужно
            proxy_buffering off;
        }

        # Опционально: защита от прямого доступа к /admin/
        # location = / {
        #     return 200 'Use / to access pgAdmin via subdomain\n';
        #     add_header Content-Type text/plain;
