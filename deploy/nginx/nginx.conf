worker_processes auto;

events {
    worker_connections 1024;
    use kqueue;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;
    charset utf-8;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    upstream backend {
        server localhost:8080;
        keepalive 32;
    }

    server {

        listen       8090;
        server_name  localhost;
        root         /usr/local/var/www;

    add_header X-Debug-Request-URI "$request_uri" always;
    add_header X-Debug-Location "default" always;
    add_header X-Debug-File-Path "$document_root$uri" always;

        location = /api/v2 {
            return 301 /api/v2/;
        }

        # Точное совпадение для корня - отдаем index.html
        location = /api/v2/ {
            alias /usr/local/var/www/swagger/;
            try_files /index.html =404;
        }

        # Обработка всех остальных запросов в /api/v2/
        location ^~ /api/v2/ {
            alias /usr/local/var/www/swagger/;  # Обязательно завершающий слэш!

            # Отладочные заголовки
            add_header X-Debug-Location "SUPER" always;
            add_header X-Debug-Request-Filename "$request_filename" always;
            add_header X-Debug-Document-Root "$document_root" always;

            # Важно: try_files должен использовать относительный путь
            try_files $uri $uri/ @proxy_api;

            autoindex off;
            expires 1h;
            access_log off;
        }

        location ^~ /api/v1/ {
            try_files "" @proxy_api;
            add_header X-Debug-Location "API_V1_DIRECT_PROXY" always;
        }

        # Проксирование на бэкенд
        location @proxy_api {
        add_header X-Debug-Location "named_location_proxy_api_v2" always;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS заголовки
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;

            # Для OPTIONS запросов сразу возвращаем 204
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        location = /legacy {
            alias /usr/local/var/www/static/tech_ui;
            add_header Content-Type application/octet-stream;
            add_header Content-Disposition "attachment; filename=tech_ui";
        }

        location /docs {
            alias /usr/local/var/www/documentation/;
            autoindex on;

            location ~ \.md$ {
                default_type text/html;
                try_files $uri.html $uri =404;
            }

            location ~* \.(svg|jpg|jpeg|png|gif|ico|css|js)$ {
                expires 30d;
                add_header Cache-Control "public";
            }

            location ~ \.html$ {
                try_files $uri =404;
                default_type text/html;
            }
        }

        location ~* \.(svg|jpg|jpeg|png|gif|ico|css|js)$ {
        add_header X-Debug-Location "global_static" always;
            root /usr/local/var/www/static;
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public";
        }

        location / {
            alias /usr/local/var/www/static/;
            try_files $uri $uri/ /index.html;
        }

        location /reserved/ {
            alias /usr/local/var/www/static/;
            try_files $uri $uri/ /index.html;
        }

        location /managment {
            alias /usr/local/var/www/management/;
            try_files $uri $uri/ =404;
            index index.html;
        }

        location = /status {
            alias /usr/local/var/www/status/index.html;
            default_type text/html;
        }

        location = /status/raw {
            stub_status on;
            add_header Content-Type text/plain;
        }

        location /admin/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://localhost:5051/;
            proxy_redirect ~^http://[^/]+(/.*)$ $scheme://$http_host$1;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/local/var/www/static;
        }
    }
}
