worker_processes 12;
worker_rlimit_nofile 4096;

events {
    worker_connections 1024;
    use kqueue;
    multi_accept on;
}

http {
    log_format combined_test '$time_local | $request_method | $request_uri | → $upstream_addr | $status | $request_time | $http_user_agent | X-Test-ID: "$http_x_test_id"';

    access_log /opt/homebrew/var/log/nginx/access.log combined_test;
    error_log /var/log/nginx/error.log debug;

    include mime.types;
    default_type application/octet-stream;
    charset utf-8;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens off;

    more_set_headers "Server: QuickFlow Application";
    proxy_hide_header Server;

    # === UPSTREAMS ===

    # Балансировка для GET-запросов (2:1:1)
    upstream backend_main_read {
            server localhost:8080 weight=2;
            server localhost:8070 weight=1;
            server localhost:8060 weight=1;
        }

        upstream backend_main_write {
            server localhost:8080;
        }

        # --- /mirror ---
        upstream backend_mirror_read {
            server localhost:10080 weight=2;
            server localhost:10070 weight=1;
            server localhost:10060 weight=1;
        }

        upstream backend_mirror_write {
            server localhost:10080;
        }


    # === SERVER ===
    server {
        listen 8090;
        server_name localhost;
        root /usr/local/var/www;

        # --- Swagger UI ---
        location = /api/v2 {
            return 301 /api/v2/;
        }

        location = /api/v2/ {
            alias /usr/local/var/www/swagger/;
            try_files /index.html =404;
        }

        location ^~ /api/v2/ {
            alias /usr/local/var/www/swagger/;
            try_files $uri $uri/ @proxy_api;
            autoindex off;
            expires 1h;
            access_log off;
        }

        # --- API ROUTING ---
        location ^~ /api/v1/ {
            try_files "" @proxy_api;
        }

        # --- ОСНОВНОЙ ПРОКСИ ---
        location @proxy_api {
            # Методы записи — только на backend_write
            if ($request_method ~ ^(POST|PUT|PATCH|DELETE)$) {
                set $target "write";
            }

            # GET, HEAD — на backend_read
            if ($request_method ~ ^(GET|HEAD)$) {
                set $target "read";
            }

            # Если не определили — на запись (fallback)
            if ($target = "") {
                set $target "write";
            }

            # Прокси в зависимости от цели
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Проброс
            proxy_pass http://backend_main_$target;

            # Добавляем CORS
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;

            # Обработка OPTIONS
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        location ~ ^/mirror/(api/v1|api/v2)/(.+)$ {
            # Убираем префикс /mirror, оставляем путь
            set $api_path /$1/$2;

            # Определяем, куда направить: read или write
            if ($request_method ~ ^(POST|PUT|PATCH|DELETE)$) {
                set $target "write";
            }
            if ($request_method ~ ^(GET|HEAD)$) {
                set $target "read";
            }
            if ($target = "") {
                set $target "write";  # fallback
            }
            proxy_pass http://backend_mirror_$target$api_path$is_args$args;

            # Прокси-заголовки
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;

            # Обработка preflight
            if ($request_method = OPTIONS) {
                return 204;
            }
        }


        # --- ERROR HANDLING ---
        proxy_intercept_errors on;

        error_page 500 502 503 504 = @error_service_unavailable;

        location @error_service_unavailable {
            return 503 'Service temporarily unavailable. Please try again later.';
        }

        location = /legacy {
            alias /usr/local/var/www/static/tech_ui;
            add_header Content-Type application/octet-stream;
            add_header Content-Disposition "attachment; filename=tech_ui";
        }

        location /docs {
            alias /usr/local/var/www/documentation/;
            autoindex on;

            location ~ \.md$ {
                default_type text/html;
                try_files $uri.html $uri =404;
            }

            location ~* \.(svg|jpg|jpeg|png|gif|ico|css|js)$ {
                expires 30d;
                add_header Cache-Control "public";
            }

            location ~ \.html$ {
                try_files $uri =404;
                default_type text/html;
            }
        }

        location ~* \.(svg|jpg|jpeg|png|gif|ico|css|js)$ {
            root /usr/local/var/www/static;
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public";
        }

        location / {
            alias /usr/local/var/www/static/;
            try_files $uri $uri/ /index.html;
        }

        location /reserved/ {
            alias /usr/local/var/www/static/;
            try_files $uri $uri/ /index.html;
        }

        location /managment {
            alias /usr/local/var/www/management/;
            try_files $uri $uri/ =404;
            index index.html;
        }

        location = /status {
            alias /usr/local/var/www/status/index.html;
            default_type text/html;
        }

        location = /status/raw {
            stub_status on;
            add_header Content-Type text/plain;
        }

        location /admin/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://localhost:5051/;
            proxy_redirect ~^http://[^/]+(/.*)$ $scheme://$http_host$1;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/local/var/www/static;
        }
    }
}
