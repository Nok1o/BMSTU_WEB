<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Статус сервера</title>
    <link rel="stylesheet" href="/css/status.css">
    <link rel="stylesheet" href="/css/back-button.css">
</head>
<body>
    <div class="container">
        <h1>Статус Nginx</h1>
        <pre id="status-content">Загрузка...</pre>
        <div class="info">
            <p><strong>Active connections</strong> — количество активных соединений</p>
            <p><strong>server accepts handled requests</strong> — принятые / обработанные / запросы</p>
            <p><strong>Reading</strong> — заголовки читаются</p>
            <p><strong>Writing</strong> — ответ записывается</p>
            <p><strong>Waiting</strong> — keep-alive соединения</p>
        </div>
        <div class="back-btn-container">
            <a href="/managment" class="back-btn">Панель управления</a>
        </div>
    </div>

    <script src="/js/status.js"></script>
</body>
</html>
