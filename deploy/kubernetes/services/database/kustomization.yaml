apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- postgres-deployment.yaml
- postgres-service.yaml
- redis-deployment.yaml
- redis-service.yaml
- postgres-pvc.yaml
- redis-pvc.yaml

configMapGenerator:
- name: postgres-config
  files:
  - config/postgres/pg_hba.conf
  - config/postgres/init.sql
- name: redis-config
  files:
  - config/redis/redis.conf

secretGenerator:
- name: postgres-secret
  envs:
  - postgres-secrets.env
- name: redis-secret
  envs:
  - redis-secrets.env