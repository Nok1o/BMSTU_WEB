apiVersion: v1
kind: Service
metadata:
  name: gateway
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "9080"
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30081
    - name: metrics
      protocol: TCP
      port: 9080
      targetPort: 9080