apiVersion: v1
kind: Service
metadata:
  name: messenger-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "9084"
spec:
  selector:
    app: messenger-service
  ports:
    - name: grpc
      protocol: TCP
      port: 8084
      targetPort: 8084
    - name: metrics
      protocol: TCP
      port: 9084
      targetPort: 9084
