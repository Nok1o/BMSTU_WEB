apiVersion: v1
kind: Service
metadata:
  name: post-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "9082"
spec:
  selector:
    app: post-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
      name: grpc
    - protocol: TCP
      port: 9082
      targetPort: 9082
      name: metrics