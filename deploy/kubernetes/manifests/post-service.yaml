apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-service-deployment
  labels:
    app: post-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: post-service
  template:
    metadata:
      labels:
        app: post-service
    spec:
      containers:
        - name: post-service
          image: qf-post-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secrets
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: post-service # DNS-имя для доступа внутри кластера
spec:
  selector:
    app: post-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082