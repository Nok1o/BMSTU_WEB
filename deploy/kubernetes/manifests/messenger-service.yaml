apiVersion: apps/v1
kind: Deployment
metadata:
  name: messenger-service-deployment
  labels:
    app: messenger-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: messenger-service
  template:
    metadata:
      labels:
        app: messenger-service
    spec:
      containers:
        - name: messenger-service
          image: qf-messenger-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secrets
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: messenger-service # DNS-имя для доступа внутри кластера
spec:
  selector:
    app: messenger-service
  ports:
    - protocol: TCP
      port: 8084
      targetPort: 8084