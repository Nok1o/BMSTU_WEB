server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Логи Docker контейнеров
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
      - source_labels: ['__meta_docker_container_image']
        target_label: 'image'

  # Логи приложения из файлов
  - job_name: application
    static_configs:
      - targets:
          - local
        labels:
          job: quickflow-app
          __path__: /var/log/application/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) \| (?P<method>\w+) \| (?P<uri>.*) \| → (?P<upstream>.*) \| (?P<status>\d{3}) \| (?P<response_time>[\d.]+) \| (?P<user_agent>.*) \| X-Test-ID: "(?P<test_id>.*)"'
      - labels:
          method:
          status:
          upstream:
          test_id:

  # Логи Nginx
  - job_name: nginx
    static_configs:
      - targets:
          - local
        labels:
          job: nginx
          __path__: /opt/homebrew/var/log/nginx/access.log
    pipeline_stages:
      - regex:
          expression: '^(?P<ip>\S+) - - \[(?P<timestamp>[^\]]+)\] "(?P<method>\w+) (?P<uri>[^"]*) HTTP/\d\.\d" (?P<status>\d+) (?P<size>\d+) "(?P<referer>[^"]*)" "(?P<user_agent>[^"]*)"'
      - labels:
          method:
          status:
          uri: