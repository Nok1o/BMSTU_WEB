#          content:
#            application/json:
#              schema:
#                $ref: '#/components/schemas/forms.ErrorForm'

  /api/v2/sessions:
    post:
      summary: Аутентификация пользователя
      description: Аутентифицирует пользователя и создает сессию
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/forms.AuthForm'
      responses:
        "201":
          description: Сессия создана
          headers:
            Location:
              schema:
                type: string
              description: URI созданной сессии
            Set-Cookie:
              schema:
                type: string
              description: Session cookie (HttpOnly; Secure; SameSite)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forms.Session'
        "400":
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forms.ErrorForm'
        "401":
          description: Неверные учетные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forms.ErrorForm'
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forms.ErrorForm'

  /api/v2/sessions/me:
    delete:
      summary: Выход из системы
      description: Завершает сессию пользователя
      tags:
        - Auth
      security:
        - SessionAuth: []
      responses:
        "204":
          description: Успешный выход
        "401":
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forms.ErrorForm'
        "403":
          description: Недостаточно прав на удаление сессии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forms.ErrorForm'
        "404":
          description: Сессия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forms.ErrorForm'
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forms.ErrorForm'

  /api/v2/users:
    post:
      summary: Регистрация пользователя
      description: Создает новую учетную запись пользователя
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/forms.SignUpForm'
      responses:
        "201":
          description: Успешная регистрация
          headers:
            Cookie:
              schema:
                type: string
              description: Session cookie (HttpOnly; Secure; SameSite)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forms.SignupResponse'

        "400":
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forms.ErrorForm'
        "409":
          description: Пользователь с таким именем уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forms.ErrorForm'
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forms.ErrorForm'
    get:
      summary: Поиск пользователей с именем, похожим на указанный
      description: Ищет пользователей по запросу
      tags:
        - Users
      security:
        - SessionAuth: []
      parameters:
        - in: query
          name: to_search
          required: true
          schema:
            type: string
          example: "john"
        - in: query
          name: count
          required: true
          schema:
            type: integer
          example: 10
      responses:
        "200":
          description: Список найденных пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/forms.PublicUserInfoOut'
        "400":
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forms.ErrorForm'
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forms.ErrorForm'

  /api/v2/profiles/me:
    patch:
      summary: Обновить профиль пользователя
      description: Обновляет профиль текущего пользователя
      tags:
        - Users
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              name: profile
              required:
                - firstname
                - lastname
                - birth_date
                - sex
                - bio
              properties:
                firstname:
                  type: string
                  example: "John"
                lastname:
                  type: string
                  example: "Doe"
                birth_date:
                  type: string
                  format: date
