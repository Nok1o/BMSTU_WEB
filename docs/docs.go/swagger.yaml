  /api/v2/communities:
    post:
      summary: Создать сообщество
      description: Создает новое сообщество
      tags:
        - Communities
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - nickname
                - name
              properties:
                nickname:
                  type: string
                  example: "techlovers"
                name:
                  type: string
                  example: "Tech Enthusiasts"
                description:
                  type: string
                  example: "Сообщество для обсуждения технологий"
                avatar:
                  type: string
                  format: binary
                cover:
                  type: string
                  format: binary
      responses:
        "201":
          description: Сообщество создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forms.CommunityForm'
        "400":
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forms.ErrorForm'
        "401":
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forms.ErrorForm'
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forms.ErrorForm'
    get:
      summary: Поиск сообществ с именем, похожим на указанное
      description: Ищет сообщества по запросу
      tags:
        - Communities
      security:
        - SessionAuth: []
      parameters:
        - in: query
          name: to_search
          required: true
          schema:
            type: string
          example: "tech"
        - in: query
          name: count
          required: true
          schema:
            type: integer
          example: 10
      responses:
        "200":
          description: Список найденных сообществ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/forms.CommunityForm'
        "400":
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forms.ErrorForm'
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forms.ErrorForm'

